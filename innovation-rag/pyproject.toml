[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "beveragedzai-innovation-rag"
version = "0.1.0"
description = "RAG local de veille sur les brevets et publications de l'industrie des boissons"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery>=3.25,<4"]
indexing = [
  "fastembed>=0.6,<1",
  "qdrant-client>=1.14,<2",
  "sentence-transformers>=3.0,<6",
]
rag = ["llama-index-core>=0.12,<0.15"]
app = ["streamlit>=1.38,<2"]
dev = ["pytest>=8.3,<10", "pytest-cov>=5,<8", "respx>=0.21,<1"]
all = [
  "google-cloud-bigquery>=3.25,<4",
  "fastembed>=0.6,<1",
  "qdrant-client>=1.14,<2",
  "sentence-transformers>=3.0,<6",
  "llama-index-core>=0.12,<0.15",
  "streamlit>=1.38,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "respx>=0.21,<1",
]

[project.scripts]
beverage-rag = "beverage_rag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["beverage_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["beverage_rag"]
