scope:
  domain: "boissons gazeuses et boissons sans alcool"
  themes:
    beverage_domain: ["beverage"]
    preservatives_stability: ["beverage preservative", "beverage stability", "soft drink"]
    sweeteners: ["beverage sweetener", "sugar substitute beverage", "stevia beverage"]
    carbonation: ["carbonated beverage", "beverage carbonation", "carbon dioxide beverage"]
    flavors: ["beverage flavor", "beverage aroma", "soft drink flavor"]
    physical_stability:
      - "beverage emulsion instability"
      - "citrus beverage haze"
      - "beverage sedimentation"
      - "clouding agent stability"
    oxidation_shelf_life:
      - "citral oxidation beverage"
      - "limonene degradation beverage"
      - "ascorbic acid beverage oxidation"
      - "dissolved oxygen flavor beverage"
      - "pasteurized orange juice nonenzymatic browning"
      - "orange juice vitamin C degradation browning storage"
      - "orange juice carotenoid oxidation color loss"
      - "orange juice residual enzyme browning pasteurization"
    packaging_stability:
      - "PET oxygen permeability beverage"
      - "beverage packaging aroma shelf life"
    preservative_interactions:
      - "sodium benzoate ascorbic acid beverage"
      - "benzoate benzene soft drink"
      - "benzoic acid solubility acidic beverage"
    colloidal_interactions:
      - "pectin protein flocculation beverage"
      - "calcium citrate precipitation beverage"
      - "hydrocolloid beverage turbidity"
    microbial_spoilage:
      - "acid tolerant yeast soft drink"
      - "carbonated beverage microbial haze"
  languages: ["en", "fr"]
  date_from: "2010-01-01"
  date_to: "2026-12-31"
  patents:
    include_description: false
    countries: ["US", "EP", "WO", "CN", "JP", "KR", "CA", "AU"]
    ipc_prefixes: ["A23L2", "A23L27", "A23L29"]
    cpc_prefixes: ["A23L2", "A23L27", "A23L29"]

ingestion:
  enabled_sources: ["patents", "semantic_scholar"]
  pilot_limit_total: 20000
  per_source_limit:
    patents: 10000
    openalex: 0
    semantic_scholar: 10000
    pubmed: 0
  request_timeout_seconds: 60
  requests_per_second: 0.8
  output_dir: "data/raw"
  manifest_dir: "data/manifests"

preprocessing:
  input_dir: "data/raw"
  output_file: "data/processed/chunks/chunks-20k.jsonl"
  chunk_size_words: 420
  chunk_overlap_words: 60
  minimum_chunk_words: 25

indexing:
  qdrant_url: "http://localhost:6333"
  collection_name: "beverage_innovation_20k"
  dense_model: "BAAI/bge-m3"
  sparse_model: "Qdrant/bm25"
  batch_size: 16
  dense_vector_name: "dense"
  sparse_vector_name: "sparse"

retrieval:
  dense_candidates: 80
  sparse_candidates: 80
  top_k: 10
  multi_query_enabled: true
  source_balancing_enabled: true
  max_subqueries: 4
  candidates_per_query: 24
  rrf_k: 60

reranking:
  enabled: true
  provider: "http"
  model: "BAAI/bge-reranker-v2-m3"
  base_url: "http://localhost:8000"
  candidate_pool_size: 32
  request_batch_size: 16
  top_n: 12
  timeout_seconds: 300

generation:
  provider: "vllm"
  model: "beverage-qwen"
  base_url: "http://localhost:8000/v1"
  temperature: 0.1
  timeout_seconds: 600
  max_output_tokens: 1400
  max_context_chars: 14000
  quality_gate_enabled: true

evidence_policy_file: "config/evidence-policy.yaml"
chemistry_rules_file: "config/chemistry-rules.yaml"
diagnostics_file: "config/diagnostics.yaml"
