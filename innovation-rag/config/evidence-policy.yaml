version: 1
enabled: true

# Scores emitted by the configured single-label CrossEncoder are normalized to
# [0, 1] by the GPU gateway. The 0.40 operational threshold is based on the
# 2026-09-13 smoke calibration documented in docs/evidence-threshold-calibration.md.
# It remains provisional until the full labelled industrial evaluation is complete.
relevance:
  gap_max_score: 0.40
  supporting_source_min_score: 0.40
  maximum_retrieval_attempts: 2

proof:
  reranker_weight: 0.80
  source_weight: 0.20
  single_source_credit: 0.60
  strong:
    minimum_calculated_score: 80
    minimum_best_reranker_score: 0.75
    minimum_independent_sources: 2
  moderate:
    minimum_calculated_score: 44
    minimum_best_reranker_score: 0.40
    minimum_independent_sources: 1

display:
  remove_unsupported_causes: true

fallback:
  maximum_generation_attempts: 2
  retrieval_failure_message: >-
    Aucune source pertinente trouvée sur « {mechanism} » dans le corpus actuel.
  quality_failure_message: >-
    La réponse générée n’a pas satisfait les contrôles de preuve après deux tentatives.
    Aucune recommandation technique n’est fournie.
  no_safe_action_message: >-
    Aucune action corrective à la fois sûre et suffisamment documentée n’a été identifiée
    dans le corpus actuel.

