version: 1
enabled: true

# Scores emitted by the configured single-label CrossEncoder are explicitly
# normalized to [0, 1] by the GPU gateway. These initial values must be calibrated
# against the labelled evaluation set before a production demonstration.
relevance:
  gap_max_score: 0.55
  supporting_source_min_score: 0.60
  maximum_retrieval_attempts: 2

proof:
  reranker_weight: 0.80
  source_weight: 0.20
  single_source_credit: 0.60
  strong:
    minimum_calculated_score: 80
    minimum_best_reranker_score: 0.75
    minimum_independent_sources: 2
  moderate:
    minimum_calculated_score: 60
    minimum_best_reranker_score: 0.60
    minimum_independent_sources: 1

display:
  remove_unsupported_causes: true

fallback:
  maximum_generation_attempts: 2
  retrieval_failure_message: >-
    Aucune source pertinente trouvée sur « {mechanism} » dans le corpus actuel.
  quality_failure_message: >-
    La réponse générée n’a pas satisfait les contrôles de preuve après deux tentatives.
    Aucune recommandation technique n’est fournie.
  no_safe_action_message: >-
    Aucune action corrective à la fois sûre et suffisamment documentée n’a été identifiée
    dans le corpus actuel.

# High-precision canonical relation rules. Matching is performed in one sentence
# or in two adjacent sentences: ingredient lists alone do not establish a mechanism.
mechanisms:
  calcium_citrate_precipitation:
    label: "précipitation de citrate de calcium"
    aliases: ["calcium citrate precipitation", "précipitation de citrate de calcium", "citrate de calcium"]
    entity_groups:
      - ["calcium", "ca2+", "ca²+", "carbonate de calcium", "calcium carbonate"]
      - ["citrate", "citric acid", "acide citrique"]
    outcomes: ["precipitation", "precipitate", "precipitated", "précipitation", "précipité", "insoluble", "sediment", "dépôt", "turbidity", "turbidité", "trouble"]
    context: ["soda", "soft drink", "carbonated beverage", "boisson gazeuse", "citrus beverage", "lemon", "lime", "citron"]
    search_queries:
      - "calcium citrate precipitation acidic carbonated beverage"
      - "calcium citric acid insoluble salt beverage turbidity"

  pectin_protein_flocculation:
